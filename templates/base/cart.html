{{ define "cart" }}
<div id="cart-icon">
    🛒 <span id="cart-count">0</span>
</div>

<div id="cart-modal" class="cart-modal">
    <div class="cart-modal-content">
        <span class="cart-close">&times;</span>
        <h2>Ваш заказ</h2>
        
        <div id="cart-items">Корзина пуста</div>

        <div class="cart-total">
            Итого: <span id="cart-total">0</span> р.
        </div>

        <form id="order-form">
            <label>Ваше имя</label>
            <input type="text" name="name" placeholder="Введите имя" required>

            <label>Ваш телефон</label>
<input type="tel" name="phone" required 
       pattern="^(\+7|8)?[\s\-]?\(?[489][0-9]{2}\)?[\s\-]?[0-9]{3}[\s\-]?[0-9]{2}[\s\-]?[0-9]{2}$"
       title="Введите номер в формате +7 (999) 000-00-00"
       placeholder="+7 (123) 456 78-90">


            <label>Комментарий</label>
            <textarea name="comment" rows="3" placeholder="Ваш комментарий"></textarea>
            <div class="privacy-agreement">
                <input type="checkbox" id="privacy-checkbox" name="privacy" required>
                <label for="privacy-checkbox">
                    Я соглашаюсь на <a href="/download/privacy" target="_blank">обработку персональных данных</a>
                </label>
            </div>
            <div class="privacy-agreement">
                <input type="checkbox" id="offer-checkbox" name="privacy" required>
                <label for="privacy-checkbox">
                    Я соглашаюсь с <a href="/download/offer" target="_blank">правилами оферты</a>
                </label>
            </div>
            <button type="submit" class="checkout-button">Оформить заказ</button>
        </form>
    </div>
</div>
{{ end }}
