<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель заказов</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .status-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        .status-completed { background: #dcfce7; color: #166534; }
        .status-pending { background: #fef3c7; color: #92400e; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        tr:hover {
            background: #f8fafc;
        }

        .cursor-pointer { cursor: pointer; }
    </style>
</head>

<body class="bg-gray-50 p-6">

<h1 class="text-2xl font-bold mb-4">Заказы</h1>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Телефон</th>
            <th>Статус</th>
            <th>Сумма</th>
        </tr>
    </thead>
    <tbody id="orders-list"></tbody>
</table>

<!-- MODAL -->
<div id="order-modal" class="modal-overlay">
    <div class="modal-content">
        <h2 id="m-order-id" class="text-xl font-bold mb-3"></h2>

        <p><b>Имя:</b> <span id="m-name"></span></p>
        <p><b>Телефон:</b> <span id="m-phone"></span></p>
        <p><b>Статус:</b> <span id="m-status"></span></p>
        <p><b>Сумма:</b> <span id="m-total"></span></p>
<div class="mt-4">
    <h3 class="font-bold mb-2">Товары</h3>
    <ul id="m-items" class="space-y-1 text-sm text-gray-700"></ul>
</div>
        <button onclick="closeModal()" class="mt-4 bg-black text-white px-4 py-2 rounded">
            Закрыть
        </button>
    </div>
</div>

<script>
const orders = [
    {
        id: 1,
        name: "Александр Иванов",
        phone: "+7 912 345 67 89",
        status: "pending",
        total: "12 500 ₽",
        items: [
            { title: "Chanel No.5", volume: "50 ml", qty: 1, price: 8000 },
            { title: "Dior Sauvage", volume: "100 ml", qty: 1, price: 4500 }
        ]
    },
    {
        id: 2,
        name: "Мария Смирнова",
        phone: "+7 900 111 22 33",
        status: "completed",
        total: "8 200 ₽",
        items: [
            { title: "YSL Libre", volume: "50 ml", qty: 1, price: 8200 }
        ]
    }
];

function renderOrders() {
    const tbody = document.getElementById("orders-list");

    tbody.innerHTML = orders.map(o => `
        <tr onclick="openOrder(${o.id})" class="cursor-pointer">
            <td>#${o.id}</td>
            <td>${o.name}</td>
            <td>${o.phone}</td>
            <td>
                <span class="status-badge ${o.status}">
                    ${o.status === "completed" ? "Выполнен" : "В обработке"}
                </span>
            </td>
            <td>${o.total}</td>
        </tr>
    `).join("");
}

function openOrder(id) {
    const o = orders.find(x => x.id === id);
    if (!o) return;

    document.getElementById("m-order-id").innerText = "Заказ #" + o.id;
    document.getElementById("m-name").innerText = o.name;
    document.getElementById("m-phone").innerText = o.phone;
    document.getElementById("m-status").innerText = o.status;
    document.getElementById("m-total").innerText = o.total;

    const statusEl = document.getElementById("m-status");
    statusEl.className = "status-badge " + o.status;
    statusEl.innerText = o.status === "completed" ? "Выполнен" : "В обработке";

    // 🔥 ТОВАРЫ
    const itemsEl = document.getElementById("m-items");

    if (!o.items || o.items.length === 0) {
        itemsEl.innerHTML = "<li>Нет данных</li>";
    } else {
        itemsEl.innerHTML = o.items.map(item => `
            <li class="flex justify-between border-b py-1">
                <span>
                    ${item.title} (${item.volume}) × ${item.qty}
                </span>
                <span>${item.price * item.qty} ₽</span>
            </li>
        `).join("");
    }

    document.getElementById("order-modal").style.display = "flex";
}
function closeModal() {
    document.getElementById("order-modal").style.display = "none";
}

window.onclick = (e) => {
    const modal = document.getElementById("order-modal");
    if (e.target === modal) closeModal();
};

renderOrders();
</script>

</body>
</html>
