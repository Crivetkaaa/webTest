<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="/statics/css/adminProducts.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    {{template "admin_navbar"}}    

    <main class="max-w-4xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Настройки системы</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- СЕКЦИЯ: Управление документами -->
            <section class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                <h2 class="text-xl font-semibold text-gray-700 mb-4 flex items-center gap-2">
                    📄 Документы
                </h2>
                
                <form action="/admin/settings/update-docs" method="POST" enctype="multipart/form-data" class="space-y-5" id="document-form">
                    
                    <!-- Загрузка Оферты -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Договор оферты</label>
                        <input type="file" name="offer"
                               class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-gray-300 rounded-md p-1">
                    </div>

                    <!-- Загрузка Политики ПД -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Политика персональных данных</label>
                        <input type="file" name="privacy" 
                               class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-gray-300 rounded-md p-1">
                    </div>

                    <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition font-medium shadow-sm">
                        Обновить документы
                    </button>
                </form>
            </section>

            <!-- СЕКЦИЯ: Изменение пароля -->
            <section class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                <h2 class="text-xl font-semibold text-gray-700 mb-4 flex items-center gap-2">
                    🔒 Безопасность
                </h2>
                
                <form action="/admin/settings/change-password" method="POST" class="space-y-4" id="password-form">
                    
                    <!-- Текущий пароль -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Текущий пароль</label>
                        <input type="password" name="current_password" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>

                    <!-- Новый пароль -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Новый пароль</label>
                        <input type="password" name="new_password" required minlength="8"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>

                    <!-- Подтверждение пароля -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Подтвердите новый пароль</label>
                        <input type="password" name="confirm_password" required minlength="8"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>

                    <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition font-medium shadow-sm">
                        Изменить пароль
                    </button>
                </form>
            </section>

        </div>
    </main>
        <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2"></div>
    <script src="/statics/js/adminSettings.js"></script>
</body>
</html>
